name: Verify Grok Build v1 integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
          - name: Ubuntu x64
            runner: ubuntu-22.04
            cliOnly: true
          - name: macOS Apple Silicon
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Resolve integration target
        shell: bash
        run: node -e 'const state=require("./.grox/official-cli.json"); const version=state.integrationTarget?.publicVersion; if (!version) throw new Error("integrationTarget.publicVersion is required"); console.log(`GROK_EXPECTED_VERSION=${version}`)' >> "$GITHUB_ENV"

      - name: Install official Grok Build integration target (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GROK_BIN_DIR = Join-Path $env:RUNNER_TEMP "grok-bin"
          $installer = Invoke-RestMethod https://x.ai/cli/install.ps1
          & ([scriptblock]::Create($installer)) -Version $env:GROK_EXPECTED_VERSION
          $env:GROK_BIN_DIR | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install official Grok Build integration target (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export GROK_BIN_DIR="$RUNNER_TEMP/grok-bin"
          curl -fsSL https://x.ai/cli/install.sh | bash -s "$GROK_EXPECTED_VERSION"
          echo "$GROK_BIN_DIR" >> "$GITHUB_PATH"

      - name: Verify official ACP integration and record binary identity
        shell: bash
        run: |
          version="$(grok --version 2>&1)"
          echo "$version"
          [[ "$version" == *"grok $GROK_EXPECTED_VERSION"* ]]
          export GROK_SMOKE_OUTPUT="$RUNNER_TEMP/grok-v1-smoke.json"
          node scripts/verify-grok-v1-hermetic.mjs

      - name: Upload structured ACP integration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grok-v1-smoke-${{ matrix.name }}
          path: ${{ runner.temp }}/grok-v1-smoke.json
          if-no-files-found: error

      - name: Install pnpm
        if: matrix.cliOnly != true
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - name: Install frontend dependencies
        if: matrix.cliOnly != true
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests and build
        if: matrix.cliOnly != true
        working-directory: apps/desktop
        run: pnpm test && pnpm build

      - name: Install Rust
        if: matrix.cliOnly != true
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0

      - name: Run native Rust tests
        if: matrix.cliOnly != true
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
