name: Bug 报告
description: 提交可复现的 Grox 故障
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: checkboxes
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有重复报告
          required: true
        - label: 我使用的是官方 Grok Build CLI
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 版本
      description: Grox 版本与 `grok --version`
      placeholder: "Grox 0.3.2 / grok x.y.z"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 输入……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与日志
      description: 请移除 API Key、Token、用户名和本机敏感路径
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: 截图或录屏
      description: 如果是界面或交互问题，请尽量提供
